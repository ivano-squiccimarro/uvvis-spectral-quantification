[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uvvis-spectral-quantification"
version = "0.1.0"
description = "Reproducible PLS quantification in scattering UV-Vis matrices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4", "matplotlib>=3.8", "joblib>=1.3"]

[project.scripts]
spectral-quant = "spectral_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
